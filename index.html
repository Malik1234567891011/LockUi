<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/lock.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lockscape</title>
  </head>
  <body>
    <!-- Initial lock screen -->
    <div id="lock-screen">
      <div class="glow-ring"></div>
      <svg id="lock-svg" width="200px" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
        <path id="lock-shackle" d="M30 50 v-20 a20 20 0 0 1 40 0 v20" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
        <rect x="25" y="50" width="50" height="60" rx="8" ry="8" fill="#ffffff" />
        <circle cx="50" cy="80" r="4" fill="#111" />
        <rect x="48" y="84" width="4" height="10" rx="2" fill="#111" />
      </svg>
    </div>

    <!-- Tunnel transition effect -->
    <div id="tunnel">
      <div class="streaks"></div>
    </div>

    <!-- Paradise scene -->
    <div id="paradise">
      <div id="sun-glow"></div>

      <!-- Floating clouds -->
      <div class="clouds">
        <svg viewBox="0 0 200 60" class="cloud-svg">
          <circle cx="40" cy="30" r="20" fill="white" />
          <circle cx="70" cy="30" r="25" fill="white" />
          <circle cx="100" cy="30" r="20" fill="white" />
        </svg>
        <svg viewBox="0 0 200 60" class="cloud-svg delay">
          <circle cx="50" cy="25" r="20" fill="white" />
          <circle cx="80" cy="25" r="25" fill="white" />
          <circle cx="110" cy="25" r="20" fill="white" />
        </svg>
      </div>

      <div id="tree-container">
        <!-- Example Tree SVG -->
        <svg id="tree" viewBox="0 0 128 200" width="200" height="400" xmlns="http://www.w3.org/2000/svg">
          <!-- Larger foliage -->
          <circle cx="64" cy="90" r="70" fill="#1ca538" />
          
          <!-- Much taller and thicker trunk -->
          <rect x="56" y="140" width="16" height="100" fill="#65320b" />
        </svg>
        
        
        
      
        <!-- Bird -->
        <svg id="bird" viewBox="0 0 64 64" width="32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="16" fill="#4A90E2" />
          <circle cx="36" cy="28" r="3" fill="#fff" />
          <circle cx="37" cy="28" r="1.5" fill="#000" />
          <polygon points="44,32 54,28 44,36" fill="#f8b400" />
        </svg>
        
      </div>
      
      

      <!-- High-quality animated grass blades -->
      <div id="grass-field-back" class="grass-field layer-back"></div>
      <div id="grass-field" class="grass-field"></div>
      <div class="grass-shadow"></div>


      <!-- Ambient particles (glow) -->
      <div class="particles"></div>
    </div>

    <!-- Main app logic -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
